{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}{{ _("Entrar") }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <h1>{{ _("Confirmar entrada") }}</h1>
    <p class="muted">{{ _("Carregue no botão para iniciar sessão neste navegador.") }}</p>
    <form action="/auth/magic/{{ token }}" method="post">
      {{ m.csrf() }}
      <button class="btn btn--primary btn--block btn--lg" type="submit">{{ _("Entrar") }}</button>
    </form>
  </div>
</div>
{% endblock %}
