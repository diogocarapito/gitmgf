<form id="star-form" class="inline-form" method="post" action="/t/{{ tool.id }}/star" hx-post="/t/{{ tool.id }}/star" hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button class="btn star-button" type="submit" aria-pressed="{{ 'true' if starred else 'false' }}"{% if not can_star %} disabled title="{{ _('Não pode atribuir estrela à sua própria ferramenta.') }}"{% endif %}>
    {{ icon('star') }} <span>{% if starred %}{{ _("Com estrela") }}{% else %}{{ _("Dar estrela") }}{% endif %}</span> <span class="count-pill">{{ tool.stars_count }}</span>
  </button>
</form>
