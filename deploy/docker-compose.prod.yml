# Production stack (TECH_SPEC §20). From the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Add `--profile backup` once LITESTREAM_* are configured (recommended).
name: gitmgf

x-app: &app
  image: ${GITMGF_IMAGE:-gitmgf:latest}
  build:
    context: ..
    args:
      GIT_SHA: ${GIT_SHA:-dev}
  restart: unless-stopped
  env_file: ../.env
  environment:
    APP_ENV: prod
    DATA_DIR: /data
    DATABASE_PATH: /data/gitmgf.db
  volumes:
    - gitmgf_data:/data
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  app:
    <<: *app
    command: ["web"]
    expose: ["8000"]

  scheduler:
    <<: *app
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gitmgf_data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  litestream:
    image: litestream/litestream:0.3.13
    profiles: ["backup"]
    restart: unless-stopped
    command: ["replicate"]
    env_file: ../.env
    volumes:
      - gitmgf_data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  gitmgf_data:
  caddy_data:
  caddy_config:
  caddy_logs:
