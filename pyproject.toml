# Tool configuration only — gitmgf is not installed as a package (see TECH_SPEC §2.1).

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
  "S101",   # assert in tests
  "S311",   # random is not used for security
  "B008",   # FastAPI Depends() in defaults
  "RUF001", "RUF002", "RUF003",  # PT-PT text uses typographic characters
  "RUF012",
  "SIM108",
  "E501",   # ruff format owns wrapping; long strings are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603"]
# FTS queries assemble constant SQL fragments; all user input is bound (TECH_SPEC §8.2).
"app/services/search.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:authlib.*",
  "ignore:Using `httpx` with `starlette.testclient`",
  "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/scheduler.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = "app.services.*"
strict = true
disallow_any_generics = false
warn_return_any = false
